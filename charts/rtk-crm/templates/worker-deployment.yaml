# worker — arq: приложениям по сети он не нужен (только читает очередь Redis, как и в
# backend/docker-compose.yml), поэтому Service ниже — только для Prometheus.
#
# Headless Service: DNS-имя worker резолвится во ВСЕ IP подов воркера. Свой /metrics воркер отдаёт на
# порту WORKER_METRICS_PORT (9101 по умолчанию, backend/app/core/metrics.py); счётчики живут в памяти
# процесса, поэтому скрейпить надо каждую реплику отдельно (dns_sd_configs, job worker в
# files/prometheus/prometheus.yml — тот же файл, что в compose, где worker — имя сервиса).
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtk-crm.componentLabels" (dict "ctx" $ "name" "worker") | nindent 4 }}
spec:
  clusterIP: None
  # Как у api-pods: неготовый под остаётся в DNS, Prometheus видит у него up=0, а не теряет молча.
  publishNotReadyAddresses: true
  selector:
    {{- include "rtk-crm.selectorLabels" (dict "ctx" $ "name" "worker") | nindent 4 }}
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtk-crm.componentLabels" (dict "ctx" $ "name" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.worker }}
  selector:
    matchLabels:
      {{- include "rtk-crm.selectorLabels" (dict "ctx" $ "name" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rtk-crm.componentLabels" (dict "ctx" $ "name" "worker") | nindent 8 }}
    spec:
      {{- include "rtk-crm.imagePullSecrets" . | nindent 6 }}
      # backend/docker-compose.yml: depends_on redis (service_healthy) + seed
      # (service_completed_successfully, см. комментарий в api-deployment.yaml
      # про то, почему seed не нужен отдельным initContainer'ом здесь).
      # WAIT_FOR_POSTGRES тоже задан в environment worker в compose (хотя в
      # depends_on postgres не перечислен явно), поэтому ждём и его тоже.
      initContainers:
        {{- include "rtk-crm.waitForPostgres" . | nindent 8 }}
        {{- include "rtk-crm.waitForRedis" . | nindent 8 }}
      containers:
        - name: worker
          image: "{{ include "rtk-crm.apiImage" . }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["worker"]
          ports:
            - name: metrics
              containerPort: 9101
          env:
            {{- include "rtk-crm.apiEnv" . | nindent 12 }}
            - name: WAIT_FOR_POSTGRES
              value: postgres:5432
            - name: WAIT_FOR_REDIS
              value: redis:6379
          # Образ общий с api, где HEALTHCHECK проверяет HTTP-порт. Воркер
          # HTTP не слушает, поэтому здесь — 1:1 перенос отдельного
          # healthcheck сервиса worker из backend/docker-compose.yml: `arq
          # --check` читает собственный heartbeat воркера в Redis.
          livenessProbe:
            exec:
              command: ["arq", "app.worker.main.WorkerSettings", "--check"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            initialDelaySeconds: 40
          readinessProbe:
            exec:
              command: ["arq", "app.worker.main.WorkerSettings", "--check"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            initialDelaySeconds: 40
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
