{{- /*
Ingress — опциональный, выключен по умолчанию (ingress.enabled=false).
Топология backend/docker-compose.yml подразумевает, что Caddy УЖЕ САМ —
единственная точка входа со своей TLS-терминацией (:8080/:8443/:8333, см.
caddy-deployment.yaml и его Service). Этот шаблон — для тех, кто вместо
прямой публикации Service caddy (LoadBalancer/NodePort) хочет использовать
нативный ingress-контроллер кластера перед ним.
*/ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caddy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtk-crm.componentLabels" (dict "ctx" $ "name" "caddy") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: caddy
                # HTTP (не HTTPS): TLS в этом сценарии терминирует сам
                # ingress-контроллер (см. .Values.ingress.tls) — Caddy за
                # ним обслуживает уже как обычный HTTP-апстрим на :8080.
                port:
                  number: 8080
          {{- end }}
    {{- end }}
{{- end }}
