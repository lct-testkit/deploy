# Единственный Secret чарта — все пароли/ключи из values.secrets.*, НЕ
# захардкожены по месту использования. Значения по умолчанию (values.yaml)
# — демо-дефолты backend/.env.example, каждый явно помечен "CHANGE ME" —
# см. комментарий там же.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rtk-crm.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtk-crm.componentLabels" (dict "ctx" $ "name" "rtk-crm-secrets") | nindent 4 }}
type: Opaque
{{- if eq .Values.env.appProfile "prod" }}
{{- /* APP_PROFILE=prod: без этих значений migrate/api не стартуют (backend отвергает пустые ключи и демо-секреты). */}}
{{- $_ := required "env.appProfile=prod: задайте secrets.fieldEncryptionKey (Fernet, 44 знака url-safe base64; без него migrate/api не стартуют)" .Values.secrets.fieldEncryptionKey }}
{{- $_ := required "env.appProfile=prod: задайте secrets.settingsEncryptionKey (Fernet)" .Values.secrets.settingsEncryptionKey }}
{{- $_ := required "env.appProfile=prod: задайте secrets.auditHmacKey (не короче 32 символов)" .Values.secrets.auditHmacKey }}
{{- $_ := required "env.appProfile=prod: задайте secrets.healthDetailsToken (не короче 24 символов)" .Values.secrets.healthDetailsToken }}
{{- end }}
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  crm-app-password: {{ .Values.secrets.crmAppPassword | quote }}
  keycloak-admin-password: {{ .Values.secrets.keycloakAdminPassword | quote }}
  keycloak-client-secret: {{ .Values.secrets.keycloakClientSecret | quote }}
  keycloak-admin-client-secret: {{ .Values.secrets.keycloakAdminClientSecret | quote }}
  signature-server-secret: {{ .Values.secrets.signatureServerSecret | quote }}
  s3-access-key: {{ .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | quote }}
  audit-hmac-key: {{ .Values.secrets.auditHmacKey | quote }}
  settings-encryption-key: {{ .Values.secrets.settingsEncryptionKey | quote }}
  smtp-password: {{ .Values.secrets.smtpPassword | quote }}
  field-encryption-key: {{ .Values.secrets.fieldEncryptionKey | quote }}
  field-encryption-key-prev: {{ .Values.secrets.fieldEncryptionKeyPrev | quote }}
  health-details-token: {{ .Values.secrets.healthDetailsToken | quote }}
  cms-auth-token: {{ .Values.secrets.cmsAuthToken | quote }}
  lms-auth-token: {{ .Values.secrets.lmsAuthToken | quote }}
  grafana-admin-password: {{ .Values.secrets.grafanaAdminPassword | quote }}
