# Единственный Secret чарта — все пароли/ключи из values.secrets.*, НЕ
# захардкожены по месту использования. Значения по умолчанию (values.yaml)
# — демо-дефолты backend/.env.example, каждый явно помечен "CHANGE ME" —
# см. комментарий там же.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rtk-crm.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtk-crm.componentLabels" (dict "ctx" $ "name" "rtk-crm-secrets") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  crm-app-password: {{ .Values.secrets.crmAppPassword | quote }}
  keycloak-admin-password: {{ .Values.secrets.keycloakAdminPassword | quote }}
  keycloak-client-secret: {{ .Values.secrets.keycloakClientSecret | quote }}
  keycloak-admin-client-secret: {{ .Values.secrets.keycloakAdminClientSecret | quote }}
  signature-server-secret: {{ .Values.secrets.signatureServerSecret | quote }}
  s3-access-key: {{ .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | quote }}
