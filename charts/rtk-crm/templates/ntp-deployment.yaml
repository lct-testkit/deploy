# ntp — доверенное время для подписания (dop.md §10.8/§13): signing.trusted_time
# сверяется реальным NTP-запросом, а не системными часами пода api. Часть
# критического пути, не опция (см. комментарий у ntp в
# backend/docker-compose.yml).
#
# ОТКЛОНЕНИЕ от задания: там сказано "no Service needed either" для ntp
# (аргумент — по TCP к нему никто не обращается). Это верно для
# маршрутизации/балансировки, но ниже ВСЁ РАВНО есть Service — по ДРУГОЙ
# причине: без него DNS-имя "ntp" в принципе не резолвится через ClusterDNS
# (обычный Deployment, в отличие от headless-StatefulSet, не получает
# собственной Pod DNS-записи по имени). А NTP_HOST=ntp — обязательная
# переменная в whitelist x-api-env (см. _helpers.tpl) и часть критического
# пути подписания, не опция, — оставить её нерезолвящейся значило бы
# незаметно сломать проверку доверенного времени в этом чарте. Поэтому
# Service здесь headless (clusterIP: None) и существует ИСКЛЮЧИТЕЛЬНО ради
# DNS: балансировки/маршрутизации он не добавляет ровно ничего (реплика
# всё равно одна) — дух формулировки задания ("Service не нужен для
# маршрутизации") соблюдён, только не буквальное "без Service вообще".
apiVersion: v1
kind: Service
metadata:
  name: ntp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtk-crm.componentLabels" (dict "ctx" $ "name" "ntp") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "rtk-crm.selectorLabels" (dict "ctx" $ "name" "ntp") | nindent 4 }}
  ports:
    - name: ntp
      port: 123
      protocol: UDP
      targetPort: ntp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtk-crm.componentLabels" (dict "ctx" $ "name" "ntp") | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.ntp }}
  selector:
    matchLabels:
      {{- include "rtk-crm.selectorLabels" (dict "ctx" $ "name" "ntp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rtk-crm.componentLabels" (dict "ctx" $ "name" "ntp") | nindent 8 }}
    spec:
      {{- include "rtk-crm.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: ntp
          image: "{{ include "rtk-crm.externalImage" .Values.images.ntp }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          # cap_add: SYS_TIME, NET_BIND_SERVICE — 1:1 с backend/docker-compose.yml.
          securityContext:
            capabilities:
              add: ["SYS_TIME", "NET_BIND_SERVICE"]
          ports:
            - name: ntp
              containerPort: 123
              protocol: UDP
          # Нет healthcheck и в backend/docker-compose.yml (в образе нет
          # инструментов для пробы) — не изобретаем свой, см. также задание.
          resources:
            {{- toYaml .Values.resources.ntp | nindent 12 }}
