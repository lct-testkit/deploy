# Прод-профиль RTK School CRM: тот же стек и топология, что
# backend/docker-compose.yml, но образы тянутся готовыми (см. ../images.yaml),
# а не собираются локально. Рассчитан на реальный сервер, а не на локальную
# разработку — подробнее см. README.md рядом с этим файлом.
#
# В файле НЕТ литералов образов: каждый `image:` — переменная <ИМЯ>_IMAGE из
# .env.images, который генерирует scripts/render_env_images.py из images.yaml.
#
#   bash scripts/gen_env.sh                      # .env с новыми секретами + runtime/
#   python scripts/render_env_images.py > .env.images
#   docker compose --env-file .env --env-file .env.images up -d
#
# Профили: без флага — весь боевой стек (включая web); `integrations` —
# mock-lms/mock-cms; `registry` — внутренний registry контура; `demo-data` —
# моковые данные демо-стенда (scripts/seed_demo.sh); `monitoring` — Prometheus + Grafana
# (scripts/bundle_install.sh --monitoring), дашборды за Caddy на /grafana.

name: rtk-crm

# Без ротации json-file-драйвер Docker копит логи на диске неограниченно
# (особенно Caddy: строка JSON на каждый запрос). 10 МБ × 3 файла на
# контейнер — этого хватает на просмотр недавней истории, не разрастаясь
# без контроля. Идентично backend/docker-compose.yml.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Тот же whitelist переменных, что x-api-env в backend/docker-compose.yml —
# скопирован без изменений. Именно этот список, а не .env целиком,
# определяет, что реально долетает до контейнеров api/worker/migrate/seed.
x-api-env: &api-env
  APP_PROFILE: ${APP_PROFILE:-demo}
  DATABASE_URL: postgresql+asyncpg://crm_app:${CRM_APP_PASSWORD:-crm_app}@postgres:5432/${POSTGRES_DB:-crm}
  CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:-crm_app}
  KC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@postgres:5432/keycloak
  REDIS_URL: redis://redis:6379/0
  BASE_URL: ${BASE_URL:-http://localhost:8080}
  KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080/auth}
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-crm}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-crm-bff}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-crm-bff-secret}
  KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-crm-admin}
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-crm-admin-secret}
  KEYCLOAK_VERIFY_AUDIENCE: ${KEYCLOAK_VERIFY_AUDIENCE:-true}
  # Прямой вход по Authorization: Bearer в обход серверной сессии (нужен нагрузочному тесту —
  # backend/loadtest/README.md); в prod бэкенд сам ограничивает его ролью INTEGRATION. gen_env.sh
  # пишет true в demo/dev .env — без этой строки якорь его не пробрасывал в контейнер api/worker,
  # и Bearer молча получал 401 даже на profile=demo (тот же класс пропуска, что #17 закрыл для
  # AUDIT_HMAC_KEY/SETTINGS_ENCRYPTION_KEY/SMTP_*).
  ALLOW_BEARER_AUTH: ${ALLOW_BEARER_AUTH:-false}
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-crm_access}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-crm_secret_key}
  SIGNATURE_SERVER_SECRET: ${SIGNATURE_SERVER_SECRET:-change-me-in-prod}
  NTP_HOST: ntp
  SMS_GATEWAY_URL: http://sms-gateway-mock:8090
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  CMS_WEBHOOK_SECRET_REF: ${CMS_WEBHOOK_SECRET_REF:-}
  LMS_BASE_URL: ${LMS_BASE_URL:-}
  LMS_AUTH_REF: ${LMS_AUTH_REF:-}
  BITRIX_CONNECTOR_ENABLED: ${BITRIX_CONNECTOR_ENABLED:-false}
  BITRIX_WEBHOOK_URL_REF: ${BITRIX_WEBHOOK_URL_REF:-}
  INTEGRATION_WEBHOOK_RATE_LIMIT_PER_MIN: ${INTEGRATION_WEBHOOK_RATE_LIMIT_PER_MIN:-60}
  CMS_WEBHOOK_SECRET: ${CMS_WEBHOOK_SECRET:-}
  BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
  BITRIX_SOURCE_ID: ${BITRIX_SOURCE_ID:-OTHER}
  ALLOWED_FILE_EXTENSIONS: ${ALLOWED_FILE_EXTENSIONS:-png,jpeg,jpg,pdf,zip,gz,gzip,rar,doc,docx,xls,xlsx,xml,csv,json}
  # Ключ HMAC цепочки аудита (хэш v3) и ключ шифрования секретных системных настроек: gen_env.sh создаёт оба.
  AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
  # Почта (ссылки подписантам, email-уведомления): без SMTP_HOST письма остаются в очереди.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SIGNATURE_EXPOSE_DEBUG_OTP: ${SIGNATURE_EXPOSE_DEBUG_OTP:-}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?выполните scripts/render_env_images.py}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      LANG: ru_RU.utf8
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - log_min_duration_statement=500
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Источник — backend/deploy/postgres/init-keycloak-db.sh, скопирован
      # verbatim в ./postgres/ (см. README.md этого каталога).
      - ./postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
    ports:
      # Только loopback хоста (psql/pg_dump с самой машины); наружу порт не публикуем.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    networks: [crm]

  redis:
    image: ${REDIS_IMAGE:?выполните scripts/render_env_images.py}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      # Не вытеснять ничего: `volatile-lru` выбрасывал сессии и ключи идемпотентности (у них есть TTL).
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    networks: [crm]

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:?выполните scripts/render_env_images.py}
    restart: unless-stopped
    # -master.volumePreallocate=false: без него SeaweedFS при создании тома сразу резервирует на диске весь
    # volumeSizeLimitMB (1 ГБ на том, по 7 томов на каждый из 5 бакетов): пустой стенд занимал 20–36 ГБ, а три стенда
    # на одной VM забивали диск до отказа записи (No space left on device, 500 в API). С флагом место выделяется по
    # мере роста данных. Комментарий стоит здесь, а не внутри command: внутри `>` он попал бы в командную строку.
    command: >
      server
      -dir=/data
      -master.volumeSizeLimitMB=1024
      -master.volumePreallocate=false
      -volume.max=100
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweed_data:/data
      # Источник — backend/deploy/seaweedfs/s3.json, скопирован verbatim в ./seaweedfs/.
      # Демо-файл из репо или runtime/seaweedfs/s3.json, сгенерированный gen_env.sh
      # с секретами из .env (SEAWEED_S3_CONFIG задаётся в .env).
      - ${SEAWEED_S3_CONFIG:-./seaweedfs/s3.json}:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # master и volume-сервер SeaweedFS стартуют друг за другом; сбои в этот
      # период не считаются (иначе `up --wait` падал на холодном старте).
      start_period: 40s
    logging: *logging
    networks: [crm]

  ntp:
    image: ${NTP_IMAGE:?выполните scripts/render_env_images.py}
    restart: unless-stopped
    cap_add:
      - SYS_TIME
      - NET_BIND_SERVICE
    logging: *logging
    networks: [crm]

  sms-gateway-mock:
    # Тот же образ, что api/worker/migrate/seed — отличается только командой
    # entrypoint.sh (см. комментарий в services у ../images.yaml).
    image: ${API_IMAGE:?выполните scripts/render_env_images.py}
    command: ["sms-gateway-mock"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health/live',
             timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [crm]

  keycloak:
    image: ${KEYCLOAK_IMAGE:?выполните scripts/render_env_images.py}
    restart: unless-stopped
    command:
      - start
      - --import-realm
    environment:
      # Администратор master realm. Keycloak 25.x читает KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD; KC_BOOTSTRAP_ADMIN_*
      # появились только в 26 и в 25.0.x игнорируются (тогда в master realm нет ни одного пользователя, и в консоль
      # не войти). Оставлены оба набора: при переходе на 26+ ничего менять не придётся. Пользователь создаётся при
      # старте, только если в master realm ещё нет пользователей.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-crm}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080/auth}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      # Источник — backend/deploy/keycloak/realm-crm.json, скопирован verbatim в ./keycloak/.
      # Демо-realm из репо или runtime/keycloak/, сгенерированный gen_env.sh.
      - ${KEYCLOAK_IMPORT_DIR:-./keycloak}:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '\"UP\"' <&3"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks: [crm]

  migrate:
    image: ${API_IMAGE:?выполните scripts/render_env_images.py}
    command: ["migrate"]
    environment:
      <<: *api-env
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@postgres:5432/\
        ${POSTGRES_DB:-crm}"
      WAIT_FOR_POSTGRES: postgres:5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [crm]

  seed:
    image: ${API_IMAGE:?выполните scripts/render_env_images.py}
    command: ["seed"]
    environment:
      <<: *api-env
      WAIT_FOR_POSTGRES: postgres:5432
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [crm]

  api:
    image: ${API_IMAGE:?выполните scripts/render_env_images.py}
    command: ["api"]
    restart: unless-stopped
    environment:
      <<: *api-env
      WAIT_FOR_POSTGRES: postgres:5432
      WAIT_FOR_REDIS: redis:6379
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      crm:
        # Prometheus скрейпит КАЖДУЮ реплику (dns_sd_configs по этому имени, см. prometheus/prometheus.yml).
        aliases: [api-pods]

  worker:
    image: ${API_IMAGE:?выполните scripts/render_env_images.py}
    command: ["worker"]
    restart: unless-stopped
    environment:
      <<: *api-env
      WAIT_FOR_POSTGRES: postgres:5432
      WAIT_FOR_REDIS: redis:6379
    healthcheck:
      test: ["CMD", "arq", "app.worker.main.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [crm]

  caddy:
    # Версия и digest — в ../images.yaml (external.caddy).
    image: ${CADDY_IMAGE:?выполните scripts/render_env_images.py}
    restart: unless-stopped
    ports:
      # Plain-http :8080 (healthcheck, локальный доступ). В публичных режимах TLS (internal/acme) HTTP_BIND=127.0.0.1:
      # Docker публикует порты в обход ufw, и открытый наружу plain-http внутри демо-стенда не нужен.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
      # Контейнерный :80 — выпуск сертификата Let's Encrypt (HTTP-01) и редирект http -> https. Значение — вся
      # спецификация публикации: по умолчанию эфемерный порт на loopback (наружу не публикуем), в публичных
      # режимах gen_env.sh ставит 80:80.
      - "${CRM_PORT80_PUBLISH:-127.0.0.1::80}"
      # TLS-сайт: локально 8443, на публичном хосте 443 (CRM_TLS_PORT — порт внутри контейнера).
      - "${HTTPS_PORT:-8443}:${CRM_TLS_PORT:-8443}"
      - "${HTTPS_PORT:-8443}:${CRM_TLS_PORT:-8443}/udp"
      - "${S3_PROXY_PORT:-8333}:8333"
    environment:
      S3_ORIGIN: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      # Адреса, которым видна консоль администратора Keycloak (см. Caddyfile); по умолчанию — закрытые сети.
      ADMIN_CONSOLE_ALLOW: ${ADMIN_CONSOLE_ALLOW:-private_ranges}
      WEB_UPSTREAM: ${WEB_UPSTREAM:-web:3000}
      CSP_SCRIPT_SRC: ${CSP_SCRIPT_SRC:-'self'}
      CRM_TLS_HOST: ${CRM_TLS_HOST:-localhost}
      # Режим TLS (см. Caddyfile): tls_internal | tls_acme; S3-сайт: адрес и его TLS. Значения всегда непустые:
      # пустое имя snippet'а Caddy не принимает.
      CRM_TLS_PORT: ${CRM_TLS_PORT:-8443}
      CRM_TLS_SNIPPET: ${CRM_TLS_SNIPPET:-tls_internal}
      S3_SITE_ADDRESS: ${S3_SITE_ADDRESS:-:8333}
      S3_TLS_SNIPPET: ${S3_TLS_SNIPPET:-tls_none}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Шрифты Rostelecom Basis: лицензионные, в git и образ web не входят. Каталог с *.woff (FONTS_DIR задаёт
      # gen_env.sh --fonts; по умолчанию ./fonts рядом с compose, там только .gitkeep). Пустой каталог не ошибка.
      - ${FONTS_DIR:-./fonts}:/srv/fonts:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_healthy
      web:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [crm]

  web:
    # Статический SPA (SvelteKit, adapter-static) за тем же Caddy, готовый
    # образ вместо сборки из ../frontend. Входит в основной стек: без него
    # Caddy отдаёт 502 на `/`.
    image: ${WEB_IMAGE:?выполните scripts/render_env_images.py}
    restart: unless-stopped
    environment:
      APP_MODE: ${APP_MODE:-demo}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-crm}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-crm-bff}
      # Нужен только APP_MODE=demo (вход паролем прямо из SPA): entrypoint подставляет секрет
      # в config.json. В prod-режиме образ web его не использует.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-crm-bff-secret}
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [crm]

  # Заглушки внешних контрактов (спека §4.14): Prism поднимает сервер из
  # OpenAPI. Профиль integrations: docker compose --profile integrations up -d
  mock-lms:
    profiles: ["integrations"]
    image: ${MOCK_LMS_IMAGE:?выполните scripts/render_env_images.py}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [crm]

  mock-cms:
    profiles: ["integrations"]
    image: ${MOCK_CMS_IMAGE:?выполните scripts/render_env_images.py}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [crm]

  # Моковые данные демо-стенда (профиль demo-data): три скрипта из ../seed ходят в
  # API под демо-учётками (организации, сделки, задачи, справочники, праздники, ЕГРЮЛ,
  # сценарии удаления ПДн). Стек сам этот сервис не поднимает: его запускает
  # scripts/seed_demo.sh (`run --rm --no-deps`) после `up --wait`. Обращаются скрипты
  # к Caddy внутри сети compose — DNS и TLS снаружи не нужны. Только для APP_PROFILE=demo:
  # в prod Bearer-вход ограничен ролью INTEGRATION, а /config.json не отдаёт секрет клиента.
  seed-demo:
    profiles: ["demo-data"]
    image: ${SEED_DEMO_IMAGE:?выполните scripts/render_env_images.py}
    working_dir: /seed
    entrypoint: ["sh", "/seed/run.sh"]
    environment:
      APP_URL: http://caddy:8080
      # Под каким адресом представляться: из него Keycloak строит issuer токенов (см. seed/lib.mjs).
      SEED_PUBLIC_URL: ${BASE_URL:-http://localhost:8080}
      # Presigned-ссылки S3 подписаны на публичный адрес, из сети compose он недоступен: запросы идут в seaweedfs.
      SEED_S3_PUBLIC_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      SEED_S3_INTERNAL_URL: http://seaweedfs:8333
    volumes:
      - ../seed:/seed:ro
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [crm]

  # Внутренний registry закрытого контура: scripts/registry_load.sh заливает
  # в него образы из офлайн-бандла. Профиль registry, порт только на loopback.
  local-registry:
    profiles: ["registry"]
    image: ${LOCAL_REGISTRY_IMAGE:?выполните scripts/render_env_images.py}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry_data:/var/lib/registry
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [crm]

  # Собирает метрики api/keycloak (см. prometheus/prometheus.yml — там же разбор, почему таргет api —
  # каждая реплика через алиас api-pods, а не общее имя сервиса). Профиль monitoring: docker compose --profile monitoring up -d
  # (scripts/bundle_install.sh --monitoring) — опционален, не входит в core. Наружу (в т.ч. через
  # Caddy) не публикуется: у Prometheus нет своей аутентификации, доступ — только контейнер-контейнер
  # внутри сети crm (Grafana ходит туда как датасорс).
  prometheus:
    profiles: ["monitoring"]
    image: ${PROMETHEUS_IMAGE:?выполните scripts/render_env_images.py}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [crm]

  # UI дашбордов по метрикам Prometheus. Датасорс и оба дашборда — file-based provisioning
  # (./grafana/provisioning, ./grafana/dashboards: те же файлы, что charts/rtk-crm/files/grafana —
  # сверяет scripts/check_drift.py), не ручной клик в UI — переживают переустановку/`down -v` тома
  # grafana_data. Отдаётся наружу через Caddy на /grafana (см. Caddyfile) — GF_SERVER_ROOT_URL и
  # GF_SERVER_SERVE_FROM_SUB_PATH ниже держат абсолютные ссылки/редиректы Grafana в этом префиксе,
  # тем же приёмом, что Keycloak и KC_HTTP_RELATIVE_PATH=/auth.
  grafana:
    profiles: ["monitoring"]
    image: ${GRAFANA_IMAGE:?выполните scripts/render_env_images.py}
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${BASE_URL:-http://localhost:8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Grafana сидит на публичном пути /grafana без отдельного IP-ограничения (в отличие от консоли
      # администратора Keycloak) — единственный барьер снаружи — её собственный вход, поэтому
      # signup/анонимный доступ выключаем явно, а не полагаемся на дефолт образа. Гостевой просмотр
      # без пароля — только осознанный opt-in (GRAFANA_ANONYMOUS_VIEWER=true в .env, для демо-стенда):
      # анонимы получают роль Viewer (только чтение), вход администратора остаётся на /grafana/login.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_VIEWER:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/grafana/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [crm]

volumes:
  registry_data:
  postgres_data:
  redis_data:
  seaweed_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

networks:
  crm:
    driver: bridge
