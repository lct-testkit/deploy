# Конфиг Prometheus контура (профиль compose `monitoring` / values.monitoring.enabled в чарте).
# Идентичен charts/rtk-crm/files/prometheus/prometheus.yml — сверяет scripts/check_drift.py,
# один и тот же файл верен для обоих способов раскладки (см. комментарий у job "api" ниже).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Сам Prometheus.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # backend/app/core/metrics.py: RED-метрики (crm_http_requests_total, crm_http_request_duration_seconds —
  # гистограмма с бакетами под бюджет p95 <= 300 мс, crm_http_errors_total), crm_audit_records_total (записи,
  # сделанные в процессе api), crm_dependency_up и crm_queue_depth (обновляются при обращении к
  # /health/ready). Отдаётся на /metrics без префикса и без авторизации (backend/app/api/health.py) —
  # доступно только внутри сети crm, Caddy отдаёт на него 404 снаружи (см. Caddyfile).
  # Метрики фоновых задач (crm_background_tasks_total, SLA, отчёты) живут в процессе воркера arq, у
  # которого своего /metrics пока нет, поэтому сюда не попадают: соответствующие панели дашборда
  # business-ops пусты, пока backend не начнёт их отдавать (см. описания панелей).
  #
  # Таргет — КАЖДАЯ реплика api, а не общее имя сервиса. Счётчики и гистограммы prometheus_client живут
  # в памяти процесса, а у api один uvicorn-воркер на контейнер, масштабирование — репликами
  # (`docker compose up -d --scale api=3`, см. backend/deploy/entrypoint.sh): каждая реплика считает
  # независимо. Один таргет "api:8000" (round-robin DNS в compose, ClusterIP в Kubernetes) отдавал бы
  # каждому scrape случайную реплику, значения счётчика прыгали бы между разными процессами, а rate()
  # принимает каждый «откат» за перезапуск счётчика и завышает результат.
  # DNS-имя api-pods резолвится во ВСЕ IP реплик: в compose это сетевой алиас сервиса api
  # (docker-compose.yml), в Kubernetes — headless Service api-pods (templates/api-deployment.yaml).
  # Prometheus заводит отдельный ряд на каждый IP (метка instance), дашборды агрегируют
  # sum(...) / sum by (le) (...) и поэтому не зависят от числа реплик.
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api-pods"]
        type: A
        port: 8000
        refresh_interval: 15s

  # KC_METRICS_ENABLED=true (см. docker-compose.yml/values.yaml) выставляет метрики на
  # management-порту 9000 — том же, что health (см. healthcheck сервиса keycloak): у него
  # KC_HTTP_RELATIVE_PATH=/auth действует и на management-интерфейсе, поэтому путь /auth/metrics,
  # а не просто /metrics.
  - job_name: keycloak
    metrics_path: /auth/metrics
    static_configs:
      - targets: ["keycloak:9000"]
