# Единый источник истины по образам RTK School CRM.
# compose/docker-compose.yml не содержит ни одного литерала образа — все
# ссылки приходят переменными `<NAME>_IMAGE` из `.env.images`, который
# генерирует `scripts/render_env_images.py` из этого файла (режимы: digest —
# онлайн, bundle — офлайн-бандл, registry — внутренний registry контура).
# Helm values сверяются с этим файлом в `scripts/check_drift.py`.
# tag/digest собственных образов заполняет бот (`.github/workflows/notify.yml`
# по repository_dispatch от backend/frontend): проверяет, что образ есть в
# GHCR и digest совпадает с тегом, и коммитит в main. Руками не правим.
version: 1

registry:
  host: ghcr.io
  project: lct-testkit

# Образы, которые собираем сами.
# repo  — репозиторий в организации, где лежит исходник
# context / dockerfile — путь внутри того репозитория
images:
  api:
    repo: backend
    context: .
    dockerfile: Dockerfile
    tag: "sha-eed5629"
    digest: "sha256:7c9fdabd31385a0ac77ec60a636398bab66a8fec3d3bd1b07ef1e35267c4d9fc"
  web:
    repo: frontend
    context: .
    dockerfile: Dockerfile
    tag: "sha-51101d3"
    digest: "sha256:f128fb3a2cea0daa9ffa086782589cd1d6ff7f89f6f1b66af6f2f291f6695c7d"
  mock-lms:
    repo: deploy
    context: mocks/lms
    dockerfile: Dockerfile
    tag: "sha-afed966"
    digest: "sha256:b10a72ffcc433cfb4b51184c82b3ae57af854fdfc3e94731b2c74f9261f74cfd"
  mock-cms:
    repo: deploy
    context: mocks/cms
    dockerfile: Dockerfile
    tag: "sha-afed966"
    digest: "sha256:714fde3d1af08d08fab5f9d6ffcb2e2f26596574db2c09024a97a99e4bed28b2"

# Сервис compose/helm -> имя образа.
# api/worker/sms-gateway-mock делят один образ (backend/Dockerfile), отличаются
# только командой entrypoint.sh — см. backend/docker-compose.yml.
services:
  api: api
  worker: api
  sms-gateway-mock: api
  migrate: api
  seed: api
  web: web
  mock-lms: mock-lms
  mock-cms: mock-cms

# Внешние образы. Тоже попадают в офлайн-бандл, поэтому
# пиним по digest, а не только по тегу — иначе "тот же тег" на чистой
# машине может оказаться другим образом.
# digest у всех шести взят с реально запущенного стенда (`docker image
# inspect ... RepoDigests`, 22.09.2026) — не переписан руками вслепую.
external:
  caddy:
    # 2.11, не 2.8: Trivy 22.09.2026 нашёл 87 CVE в 2.8.4 (5 CRITICAL) с
    # фиксом только в линии 2.11.x — см. frontend/.trivyignore.
    ref: docker.io/library/caddy:2.11-alpine
    digest: "sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e"
  postgres:
    # Один инстанс, две логические базы (crm, keycloak) — раздел 3.3/12.2,
    # см. backend/deploy/postgres/init-keycloak-db.sh. Не два контейнера.
    ref: docker.io/library/postgres:16-alpine
    digest: "sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb"
  keycloak:
    ref: quay.io/keycloak/keycloak:25.0
    digest: "sha256:82c5b7a110456dbd42b86ea572e728878549954cc8bd03cd65410d75328095d2"
  redis:
    ref: docker.io/library/redis:7-alpine
    digest: "sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7"
  seaweedfs:
    ref: docker.io/chrislusf/seaweedfs:3.68
    digest: "sha256:172f7f002fb5fb2c1fbfcb702c6c9d3482d7cbb49e913fe8d1b0331f82957cf5"
  ntp:
    # Доверенное время для подписания (раздел 9/dop.md §10.8) — часть
    # критического пути, не опция.
    ref: docker.io/cturra/ntp:latest
    digest: "sha256:7224d4e7c7833aabbcb7dd70c46c8a8dcccda365314c6db047b9b10403ace3bc"
  local-registry:
    # Внутренний registry закрытого контура (профиль compose `registry`):
    # scripts/registry_load.sh заливает в него образы из офлайн-бандла.
    ref: docker.io/library/registry:2
    digest: "sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373"
  seed-demo:
    # Рантайм node для скриптов моковых данных (seed/*.mjs): сервис compose
    # `seed-demo`, профиль `demo-data`. Имя совпадает с именем сервиса, как у
    # `local-registry`. Образ попадает в офлайн-бандл, поэтому сиды работают
    # без сети. В чарт не входит (сиды — только для демо-стенда на compose).
    ref: docker.io/library/node:24-alpine
    digest: "sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1"
  prometheus:
    # Собирает /metrics api (app/core/metrics.py) и keycloak (KC_METRICS_ENABLED) — профиль compose
    # `monitoring` / values.monitoring.enabled в чарте, по умолчанию не поднимается. v3.15.0 — текущий
    # стабильный релиз на момент добавления (не latest: тот же принцип пина, что у остальных внешних
    # образов). digest — реальный `docker pull` + `docker image inspect`, 28.09.2026.
    ref: docker.io/prom/prometheus:v3.15.0
    digest: "sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e"
  grafana:
    # OSS-редакция (AGPLv3, не grafana-enterprise). Дашборды и датасорс — file-based provisioning
    # (compose/grafana/, charts/rtk-crm/files/grafana/), заводить отдельный образ под них не нужно.
    # Тот же профиль/флаг, что у prometheus. digest — `docker pull` + `docker image inspect`, 28.09.2026.
    ref: docker.io/grafana/grafana:13.2.2
    digest: "sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0"

# Профили compose. core поднимается всегда (`docker compose up -d`): это
# ровно то, что запускает compose/docker-compose.yml без --profile.
# integrations, registry, demo-data и monitoring включаются явно (demo-data — моковые данные,
# только для демо-стенда: scripts/seed_demo.sh; monitoring — Prometheus + Grafana,
# scripts/bundle_install.sh --monitoring).
profiles:
  core:
    - caddy
    - postgres
    - keycloak
    - redis
    - ntp
    - seaweedfs
    - sms-gateway-mock
    - api
    - worker
    - migrate
    - seed
    - web
  integrations:
    - mock-lms
    - mock-cms
  registry:
    - local-registry
  demo-data:
    - seed-demo
  monitoring:
    - prometheus
    - grafana
