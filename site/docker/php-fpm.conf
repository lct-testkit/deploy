[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; Master запущен от www-data (USER в Dockerfile), поэтому директив user/group нет.
listen = 127.0.0.1:9000
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500
; Переменные окружения контейнера (APP_KEY, DB_* ...) нужны Laravel.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
