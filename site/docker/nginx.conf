# Без root: pid и временные каталоги в /tmp, порт 8080.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server_tokens off;
    client_max_body_size 64k;
    sendfile on;
    keepalive_timeout 30s;

    # /up — healthcheck, в журнал не пишем. В query-строке API только метки времени и курсор, ПДн там нет;
    # тела POST-запросов nginx не логирует.
    map $request_uri $loggable { /up 0; default 1; }
    access_log /dev/stdout combined if=$loggable;

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri /index.php?$query_string;
        }

        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 30s;
        }

        # Любой другой .php — не точка входа.
        location ~ \.php$ { return 404; }
        location ~ /\.(?!well-known) { deny all; }

        location ~* \.(css|js|svg|ico|woff2?|png|jpg)$ {
            expires 1h;
            try_files $uri =404;
        }
    }
}
