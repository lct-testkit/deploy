name: e2e

# Сквозная проверка того, что реально важно заказчику:
#   stack           — стек из образов images.yaml поднимается с нуля, проходит smoke,
#                     бэкап → восстановление в чистый стенд → smoke (спека §6);
#                     идёт на self-hosted раннере (см. комментарий у job);
#   offline-bundle  — собранный офлайн-бандл ставится на «чистой» машине БЕЗ доступа
#                     к registry и интернету (критерий №5 паспорта проекта);
#                     остаётся на GitHub-hosted раннере (см. комментарий у job).
#
# Образы api/web в GHCR приватные — нужен секрет GHCR_PULL_TOKEN (classic PAT,
# read:packages, см. docs/ghcr-setup.md). На PR из форков секретов нет — job
# честно сообщает об этом и завершается, а не «зеленеет» молча.
on:
  pull_request:
    paths:
      - "compose/**"
      - "scripts/**"
      - "seed/**"
      - "images.yaml"
      - ".github/workflows/e2e.yml"
  workflow_call:
    inputs:
      offline:
        description: "Гонять job offline-bundle: он требует раннер GitHub-hosted (release.yml отключает его, когда его нет)"
        type: boolean
        default: true
  workflow_dispatch: {}
  schedule:
    - cron: "30 2 * * *"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  stack:
    name: стек · smoke · бэкап → восстановление
    # Self-hosted, а не ubuntu-latest: у организации отключён биллинг GitHub Actions (тот же перевод, что у
    # validate/notify/publish). Раннер — aarch64: стек поднимается на нативных arm64-вариантах образов
    # (docker-publish.yml публикует api/web как multi-arch); amd64-вариант, который реально едет на прод,
    # здесь не исполняется — его проверяет установка бандла и smoke на самом стенде.
    # Безопасно для общей машины: job трогает только свои compose-проекты с уникальным именем на свободных
    # портах (E2E_PROJECT/E2E_PORT_OFFSET ниже; тома удаляются вместе с проектом, а последний шаг сносит
    # проекты по меткам, даже если скрипт убили) и ничего не делает с хостом.
    # iptables и docker system prune есть только в offline-bundle — поэтому тот job на раннер НЕ переносили.
    runs-on: [self-hosted, lct]
    # 2 vCPU на 9 раннеров: pull ~2 ГБ образов, Keycloak, smoke и второй стек для проверки восстановления.
    timeout-minutes: 60
    env:
      # Прогоны (PR, ночной, вызов из release) могут идти на одной машине одновременно, а с ними и notify
      # (проект rtk-e2e, порты 28xxx): у каждого прогона своё имя проекта, а сдвиг портов скрипт выбирает сам
      # (auto): первый, при котором свободны все порты стенда и стенда восстановления и который не задевает
      # фиксированные порты notify.
      E2E_PROJECT: rtk-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_PORT_OFFSET: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: GHCR_PULL_TOKEN задан?
        id: token
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "${GHCR_PULL_TOKEN}" ]; then
            echo "::warning::GHCR_PULL_TOKEN недоступен (PR из форка?) — e2e не выполнялся"
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.token.outputs.have == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Стенд из images.yaml (up → smoke → бэкап → восстановление → smoke)
        if: steps.token.outputs.have == 'true'
        run: bash scripts/e2e_stack.sh --with-restore

      # Страховка на случай, когда скрипт не успел прибраться за собой (таймаут, SIGKILL раннера): снести оба проекта
      # прогона по меткам compose. Общий Docker-демон иначе копил бы чужие тома и контейнеры.
      - name: Убрать стенды этого прогона
        if: always()
        run: |
          for p in "${E2E_PROJECT}" "${E2E_PROJECT}-restore"; do
            docker ps -aq --filter "label=com.docker.compose.project=${p}" | xargs -r docker rm -f || true
            docker volume ls -q --filter "label=com.docker.compose.project=${p}" | xargs -r docker volume rm || true
            docker network ls -q --filter "label=com.docker.compose.project=${p}" | xargs -r docker network rm || true
          done

  offline-bundle:
    name: офлайн-бандл ставится без сети
    # Тяжёлый (образы ~1–2 ГиБ): вручную и как гейт релиза (workflow_call из release.yml); ночью и на PR не идёт.
    # Ночной прогон отключён, пока нет раннера GitHub-hosted (биллинг): иначе каждую ночь красный run
    # без единого измерения, а `stack` выше — с бэкапом и восстановлением — по-прежнему идёт по расписанию.
    # На self-hosted НЕ переносим: job режет исходящий трафик root через iptables и делает
    # `docker system prune -af --volumes` — на общем Docker-демоне это снесло бы чужие образы и тома, а
    # раннеры остались бы без сети. К тому же бандл собирается под x86_64 (прод), а раннер aarch64:
    # установка «на чистой машине» здесь исполняла бы образы под эмуляцией. Пока биллинг GitHub Actions
    # не восстановлен, этот job красный «не запущен», а не «провален» (завершается за пару секунд).
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && format('{0}', inputs.offline) != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Собрать бандл
        run: bash scripts/build_offline_bundle.sh "ci-${GITHUB_RUN_ID}" --out "${RUNNER_TEMP}/bundle"

      - name: Распаковать и убрать ВСЕ образы («чистая машина»)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/install"
          tar -xzf "${RUNNER_TEMP}/bundle/rtk-crm-offline-ci-${GITHUB_RUN_ID}.tar.gz" -C "${RUNNER_TEMP}/install"
          docker logout ghcr.io || true
          docker system prune -af --volumes
          test -z "$(docker images -aq)"

      # Изоляция: dockerd работает от root, поэтому режем исходящий трафик root-процессов
      # (pull образов) и трафик контейнеров наружу. Runner-агент работает от другого
      # пользователя и остаётся на связи с GitHub.
      - name: Отрезать сеть
        run: |
          set -euo pipefail
          sudo iptables -I OUTPUT -m owner --uid-owner 0 ! -o lo -j DROP
          sudo iptables -I DOCKER-USER -i br+ ! -o br+ -j DROP
          sudo iptables -I DOCKER-USER -i docker0 ! -o docker0 -j DROP
          # Опубликованные порты (localhost:8080 -> контейнер) пробрасывает docker-proxy: это процесс root, и его трафик
          # в контейнеры идёт через docker-мосты. Это ЛОКАЛЬНЫЙ трафик, режем только то, что уходит за пределы хоста.
          # Правила вставляются последними, значит стоят выше DROP и срабатывают первыми.
          sudo iptables -I OUTPUT -o br+ -j ACCEPT
          sudo iptables -I OUTPUT -o docker0 -j ACCEPT
          sudo iptables -L OUTPUT -n -v --line-numbers

      - name: Проверка изоляции (pull обязан провалиться)
        run: |
          if timeout 40 docker pull hello-world >/dev/null 2>&1; then
            echo "::error::сеть НЕ отрезана: docker pull сработал — тест был бы недействителен"
            exit 1
          fi
          echo "изоляция подтверждена: docker pull не проходит"

      - name: Установка из бандла (install.sh → smoke)
        working-directory: ${{ runner.temp }}/install
        run: |
          cd "rtk-crm-offline-ci-${GITHUB_RUN_ID}"
          bash install.sh --profile demo

      - name: Логи при падении
        if: failure()
        working-directory: ${{ runner.temp }}/install
        run: |
          cd "rtk-crm-offline-ci-${GITHUB_RUN_ID}/compose" 2>/dev/null || exit 0
          docker compose --env-file .env --env-file .env.images ps -a || true
          docker compose --env-file .env --env-file .env.images logs --no-color --tail 80 || true
