name: notify

# Принимает repository_dispatch от backend/frontend после успешной сборки их
# образа (см. backend/.github/workflows/build.yml и
# frontend/.github/workflows/build.yml, шаг «Уведомить deploy») и проставляет
# tag/digest в images.yaml тем же способом, что update-manifest в build.yml
# этого репозитория делает для моков — просто с другим триггером.
on:
  repository_dispatch:
    types: [backend-image-built, frontend-image-built]

concurrency:
  # Один слот на конкретный образ: два подряд идущих коммита backend не
  # должны гоняться за правкой одной и той же строки images.yaml параллельно.
  group: notify-${{ github.event.client_payload.image }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-manifest:
    name: обновить images.yaml (${{ github.event.client_payload.image }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml ruamel.yaml

      - name: Проставить tag/digest
        run: |
          python scripts/update_image_refs.py \
            "${{ github.event.client_payload.image }}" \
            "${{ github.event.client_payload.tag }}" \
            "${{ github.event.client_payload.digest }}"

      - name: Самопроверка манифеста
        run: python scripts/validate_images.py images.yaml

      - name: Закоммитить и запушить в main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- images.yaml; then
            echo "images.yaml не изменился — пропуск коммита"
            exit 0
          fi
          git add images.yaml
          IMAGE="${{ github.event.client_payload.image }}"
          TAG="${{ github.event.client_payload.tag }}"
          git commit -m "chore(images): ${IMAGE} -> ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
