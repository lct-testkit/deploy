name: release

# Офлайн-поставка для закрытого контура (весь сервис рассчитан на контур без
# доступа в интернет): на теге vX.Y.Z собирает бандл (scripts/build_offline_bundle.sh —
# все образы из images.yaml одним архивом + compose + установщик + SHA256SUMS),
# подписывает контрольную сумму (cosign keyless) и публикует файлами релиза GitHub.
#
# Релиз выходит ТОЛЬКО после зелёного e2e.yml: стек из этих образов поднимается,
# бэкап восстанавливается, а бандл реально ставится на машине без сети.
#
# Пока у организации отключён биллинг GitHub Actions (раннера GitHub-hosted нет), штатный путь недоступен, и
# релиз собирается вручную (workflow_dispatch: runner=self-hosted, skip_offline_e2e=true): бандл собирает
# self-hosted раннер (aarch64), который тянет и сохраняет именно linux/amd64-варианты образов (прод — x86_64);
# e2e стека при этом идёт как обычно, а проверка установки без сети НЕ выполняется в CI, и заметки релиза
# прямо об этом говорят. Когда биллинг вернётся, релиз — снова просто тег vX.Y.Z.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия бандла (по умолчанию — сам тег/short sha)"
        required: false
      runner:
        description: "Где собирать бандл: github (ubuntu-latest, штатный путь) или self-hosted (нет биллинга GitHub Actions)"
        type: choice
        options: [github, self-hosted]
        default: github
      skip_offline_e2e:
        description: "Не гонять e2e установки без сети (job требует GitHub-hosted); заметки релиза скажут об этом"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: e2e перед релизом
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml
    with:
      offline: ${{ !inputs.skip_offline_e2e }}
    secrets: inherit

  offline-bundle:
    name: офлайн-бандл
    needs: verify
    # self-hosted — только по явному выбору при ручном запуске (см. шапку файла).
    runs-on: ${{ (inputs.runner == 'self-hosted' && fromJSON('["self-hosted","lct"]')) || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
      id-token: write # cosign keyless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Манифест образов должен быть полным (нет пустых tag/digest)
        run: python scripts/validate_images.py images.yaml

      - name: GHCR_PULL_TOKEN задан?
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "${GHCR_PULL_TOKEN}" ]; then
            echo "::error::GHCR_PULL_TOKEN не задан — см. docs/ghcr-setup.md п.1/п.5."
            echo "::error::GITHUB_TOKEN этого workflow не видит пакеты api/web: они опубликованы из"
            echo "::error::backend/frontend, а кросс-репо пакеты GHCR по умолчанию недоступны"
            echo "::error::GITHUB_TOKEN'у другого репозитория, даже в одной организации."
            exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Версия
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          v="${INPUT_VERSION}"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME:-$(git rev-parse --short=7 HEAD)}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Собрать бандл
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Раннер aarch64, а бандл едет на x86_64: pull и save берут только linux/amd64 (см. build_offline_bundle.sh).
          BUNDLE_PLATFORM: ${{ inputs.runner == 'self-hosted' && 'linux/amd64' || '' }}
        run: bash scripts/build_offline_bundle.sh "${VERSION}" --out dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Подписываем файл контрольных сумм архива (или его частей): проверка подписи
      # доказывает, что сумма выпущена этим workflow, а сумма — что архив цел.
      - name: Подписать контрольные суммы (cosign keyless)
        run: |
          set -euo pipefail
          cd dist
          for f in *.sha256; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}"
          done
          ls -la

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          # На push тега action сам находит тег из GITHUB_REF; на workflow_dispatch
          # (ручной ретрай без нового тега) реф-тега нет — без этого падает
          # "GitHub Releases requires a tag".
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            dist/rtk-crm-offline-*
          generate_release_notes: true
          body: |
            Офлайн-поставка RTK School CRM (${{ steps.version.outputs.version }}).
            ${{ inputs.skip_offline_e2e && '**Внимание:** установка без сети в CI не проверялась — у организации отключён' || '' }}
            ${{ inputs.skip_offline_e2e && 'биллинг GitHub Actions, раннера GitHub-hosted нет. Образы собраны под linux/amd64 на' || '' }}
            ${{ inputs.skip_offline_e2e && 'self-hosted раннере; e2e стека (подъём, smoke, бэкап → восстановление) пройден.' || '' }}

            Установка на машине без доступа в интернет:
            1. Docker и плагин `docker compose` должны быть установлены заранее (единственный шаг, требующий сеть).
            2. Проверьте архив: `sha256sum -c rtk-crm-offline-*.sha256`; подпись —
               `cosign verify-blob <файл>.sha256 --bundle <файл>.sha256.sigstore.json
               --certificate-identity-regexp '^https://github.com/lct-testkit/deploy/'
               --certificate-oidc-issuer https://token.actions.githubusercontent.com`.
            3. Распакуйте архив (если он нарезан на части: `cat rtk-crm-offline-*.tar.gz.part-* > rtk-crm-offline.tar.gz`) и выполните `bash install.sh`.
            4. Внутренний registry и чек-лист секретов перед боевой эксплуатацией — `RUNBOOK.md` в бандле.
