name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  YAMLLINT_VERSION: "1.35.1"
  HADOLINT_IMAGE: hadolint/hadolint:v2.12.0
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.6.7
  HELM_VERSION: v3.16.4
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.7
  SHELLCHECK_IMAGE: koalaman/shellcheck-alpine:v0.10.0

jobs:
  yaml:
    name: yamllint
    runs-on: [self-hosted, lct]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run "yamllint==${YAMLLINT_VERSION}" --strict -c .yamllint.yml .

  actionlint:
    name: actionlint
    runs-on: [self-hosted, lct]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Статический анализ workflow (включая проверку выражений и shellcheck)
        run: |
          bash scripts/pull_retry.sh "${ACTIONLINT_IMAGE}"
          docker run --rm -v "$PWD:/repo" -w /repo "${ACTIONLINT_IMAGE}" -color

  images-manifest:
    name: images.yaml
    runs-on: [self-hosted, lct]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/validate_images.py images.yaml

  dockerfiles:
    name: hadolint
    runs-on: [self-hosted, lct]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint по всем Dockerfile
        run: |
          set -uo pipefail
          bash scripts/pull_retry.sh "${HADOLINT_IMAGE}"
          mapfile -t files < <(git ls-files '*Dockerfile' '*Dockerfile.*' '*.Dockerfile')
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Dockerfile не найдены — проверка ничего не проверяет"
            exit 1
          fi
          rc=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            # info не валит сборку (стилистика), warning и выше — блокирующие.
            docker run --rm -i "${HADOLINT_IMAGE}" \
              hadolint --failure-threshold warning - < "$f" || rc=1
            echo "::endgroup::"
          done
          exit $rc

  compose:
    name: docker compose config
    runs-on: [self-hosted, lct]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Синтаксис и разрешение переменных со всеми профилями
        run: |
          set -euo pipefail
          python scripts/render_env_images.py > "${RUNNER_TEMP}/env.images"
          docker compose \
            -f compose/docker-compose.yml \
            --env-file compose/.env.example \
            --env-file "${RUNNER_TEMP}/env.images" \
            --profile integrations --profile registry --profile demo-data --profile monitoring \
            config --quiet
      - name: Без .env.images compose обязан падать (fail closed)
        run: |
          if docker compose -f compose/docker-compose.yml --env-file compose/.env.example config --quiet 2>/dev/null; then
            echo "::error::compose собрался без ссылок на образы — в файле появились литералы образов"
            exit 1
          fi

  trivy:
    name: trivy fs
    runs-on: [self-hosted, lct]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Misconfig-сканер здесь НЕ включён: Helm-чарт пока без securityContext (KSV-0118 и др. — известный долг,
      # см. RUNBOOK.md, раздел Kubernetes); Dockerfile проверяет hadolint. Включить, когда чарт будет захарденен.
      - name: Trivy fs (уязвимости зависимостей и секреты)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  shellcheck:
    name: shellcheck
    runs-on: [self-hosted, lct]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck scripts/*.sh
        run: |
          bash scripts/pull_retry.sh "${SHELLCHECK_IMAGE}"
          docker run --rm -v "$PWD:/mnt" -w /mnt "${SHELLCHECK_IMAGE}" shellcheck -x -S warning scripts/*.sh

  helm:
    name: helm lint + kubeconform
    runs-on: [self-hosted, lct]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Проверка чарта и отрендеренных манифестов
        run: |
          set -euo pipefail
          bash scripts/pull_retry.sh "${KUBECONFORM_IMAGE}"
          helm lint charts/rtk-crm
          helm lint charts/rtk-crm --set monitoring.enabled=true
          # monitoring.enabled=true — иначе prometheus/grafana (values.monitoring.enabled=false по
          # умолчанию, как у ingress.enabled) ни разу не попадают под kubeconform.
          helm template charts/rtk-crm --set monitoring.enabled=true \
            | docker run --rm -i "${KUBECONFORM_IMAGE}" -strict -summary -

  drift:
    name: compose · chart · копии конфигов vs images.yaml
    runs-on: [self-hosted, lct]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lct-testkit/backend
          path: backend-src
          token: ${{ secrets.BACKEND_READ_TOKEN || github.token }}
        continue-on-error: true
        id: backend
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Сверка
        run: |
          set -euo pipefail
          if [ "${{ steps.backend.outcome }}" = "success" ]; then
            python scripts/check_drift.py --backend-dir backend-src
          else
            echo "::warning::checkout backend недоступен (приватный репо без BACKEND_READ_TOKEN) — копии конфигов сверены только внутри deploy"
            python scripts/check_drift.py
          fi
