name: build

# Собирает и пушит собственные образы deploy-репо (мок-сервисы и сайт школы `site`;
# новые контексты добавляются в matrix ниже). backend/frontend публикуют
# свои образы через docker-publish.yml и присылают repository_dispatch —
# сюда это не относится.
#
# Порядок как в docker-publish.yml: сборка каждой платформы в tar → Trivy → multi-arch push
# (linux/amd64 + linux/arm64). Образ, не прошедший скан, в GHCR не попадает.
# Раннер — self-hosted [self-hosted, lct] (aarch64): `ubuntu-latest` в организации не работает
# (нет биллинга), amd64 собирается через QEMU (binfmt), arm64 — нативно. См. docs/ci-self-hosted.md.
on:
  push:
    branches: [main]
    paths:
      - "mocks/**"
      - "site/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.image }})
    # Сайт — на x86_64-раннере (метка lct-x64): amd64 под QEMU на aarch64 не собирает pdo_pgsql (autom4te/m4).
    # У этого раннера нет метки lct, поэтому прочие джобы (e2e-стек и т. п.) на него не попадают.
    runs-on: ${{ fromJSON(matrix.runs-on || '["self-hosted", "lct"]') }}
    # amd64 под QEMU на 2 vCPU: компиляция pdo_pgsql сайта и два скана — с запасом на медленный раннер.
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mock-lms
            context: mocks/lms
          - image: mock-cms
            context: mocks/cms
          # Сайт на Laravel: стадия assets тянет приватный пакет @lct-testkit/rt-ui из GitHub Packages
          # (BuildKit-секрет npm_token = NODE_AUTH_TOKEN; у deploy должен быть доступ к пакету, docs/site.md).
          - image: site
            context: site
            # Стадии Dockerfile: test (phpunit) и runtime (сайт). Без target публикуется последняя стадия; берём явно.
            target: runtime
            npm-token: "true"
            # Только x86_64: все узлы стенда amd64, а сборка pdo_pgsql под arm64 (QEMU/alpine) падает на autom4te.
            platforms: linux/amd64
            runs-on: '["self-hosted", "lct-x64"]'
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      # Пусто у образов без приватных npm-зависимостей: условие в secret-envs ниже тогда не передаёт секрет.
      NODE_AUTH_TOKEN: ${{ matrix.npm-token == 'true' && (secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Короткий sha
        id: sha
        run: echo "short=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # Кросс-сборка требует binfmt-обработчика QEMU для чужой архитектуры (как в docker-publish.yml).
      - name: QEMU (binfmt) для сборки чужой архитектуры
        # Одноархитектурной сборке на родном раннере эмуляция не нужна.
        if: ${{ !matrix.platforms || contains(matrix.platforms, ',') }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64) foreign=x86_64;  short=amd64 ;;
            x86_64)  foreign=aarch64; short=arm64 ;;
            *) echo "::error::неизвестная архитектура раннера: $(uname -m)"; exit 1 ;;
          esac
          if [ "$(head -n1 "/proc/sys/fs/binfmt_misc/qemu-${foreign}" 2>/dev/null || true)" = "enabled" ]; then
            echo "binfmt qemu-${foreign} уже включён"
          else
            echo "binfmt qemu-${foreign} не включён — ставлю"
            docker run --privileged --rm \
              tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 \
              --install "${short}"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 (в tar, для скана)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          outputs: type=docker,dest=${{ runner.temp }}/scan-amd64.tar
          push: false
          provenance: false
          tags: scan/${{ matrix.image }}:candidate-amd64
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          secret-envs: ${{ env.NODE_AUTH_TOKEN != '' && 'npm_token=NODE_AUTH_TOKEN' || '' }}

      - name: Trivy linux/amd64 (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: ${{ runner.temp }}/scan-amd64.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ${{ matrix.context }}/.trivyignore

      - name: Build linux/arm64 (в tar, для скана)
        if: ${{ !matrix.platforms || contains(matrix.platforms, 'arm64') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          outputs: type=docker,dest=${{ runner.temp }}/scan-arm64.tar
          push: false
          provenance: false
          tags: scan/${{ matrix.image }}:candidate-arm64
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          secret-envs: ${{ env.NODE_AUTH_TOKEN != '' && 'npm_token=NODE_AUTH_TOKEN' || '' }}

      - name: Trivy linux/arm64 (CRITICAL/HIGH)
        if: ${{ !matrix.platforms || contains(matrix.platforms, 'arm64') }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: ${{ runner.temp }}/scan-arm64.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ${{ matrix.context }}/.trivyignore

      - name: Push (multi-arch, SBOM + provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.sha.outputs.short }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache,mode=max
          secret-envs: ${{ env.NODE_AUTH_TOKEN != '' && 'npm_token=NODE_AUTH_TOKEN' || '' }}

      # Проверяем то, что реально лежит в GHCR: без обеих платформ образ не запустится на x86-проде или aarch64-стенде.
      - name: Проверить платформы опубликованного образа
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          # Ожидаемые платформы — те же, что собирались (у сайта только amd64).
          PLATFORMS: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect "${IMAGE_REPO}@${DIGEST}" --raw | tr -d ' \n\r\t')"
          for platform in ${PLATFORMS//,/ }; do
            arch="${platform#linux/}"
            grep -q "\"architecture\":\"${arch}\"" <<<"${raw}" || {
              echo "::error::в ${IMAGE_REPO}@${DIGEST} нет linux/${arch}"
              exit 1
            }
          done
          echo "платформы в индексе: ${PLATFORMS}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Подписать образ (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REPO}@${DIGEST}"

      - name: Записать координаты образа
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ steps.sha.outputs.short }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p image-refs
          printf '{"image": "%s", "tag": "%s", "digest": "%s"}\n' \
            "$IMAGE" "$TAG" "$DIGEST" > "image-refs/${IMAGE}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-ref-${{ matrix.image }}
          path: image-refs/${{ matrix.image }}.json
          retention-days: 1

  update-manifest:
    name: обновить images.yaml
    needs: build
    # Обновляет образы, которые собрались: упавший образ (например, мок на свежем CVE) не держит остальные.
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, lct]
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-ref-*
          path: image-refs
          merge-multiple: true

      - name: Скрипт применения ссылок
        run: |
          cat > apply_refs.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          for f in image-refs/*.json; do
            image=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['image'])" "$f")
            tag=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['tag'])" "$f")
            digest=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['digest'])" "$f")
            python scripts/update_image_refs.py "$image" "$tag" "$digest"
          done
          EOF

      - name: Проставить tag/digest и запушить в main
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          bash scripts/apply_and_push.sh \
            "chore(images): обновить tag/digest образов deploy (run ${RUN_ID})" \
            bash apply_refs.sh
