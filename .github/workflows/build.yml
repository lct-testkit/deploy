name: build

# Собирает и пушит собственные образы deploy-репо (сейчас — мок-сервисы;
# новые контексты добавляются в matrix ниже). backend/frontend публикуют
# свои образы через docker-publish.yml и присылают repository_dispatch —
# сюда это не относится.
#
# Порядок как в docker-publish.yml: локальная сборка → Trivy → push. Образ,
# не прошедший скан, в GHCR не попадает.
on:
  push:
    branches: [main]
    paths:
      - "mocks/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mock-lms
            context: mocks/lms
          - image: mock-cms
            context: mocks/cms
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Короткий sha
        id: sha
        run: echo "short=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (локально, для скана)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          provenance: false
          tags: scan/${{ matrix.image }}:candidate
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.image }}:candidate
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ${{ matrix.context }}/.trivyignore

      - name: Push (SBOM + provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.sha.outputs.short }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Подписать образ (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REPO}@${DIGEST}"

      - name: Записать координаты образа
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ steps.sha.outputs.short }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p image-refs
          printf '{"image": "%s", "tag": "%s", "digest": "%s"}\n' \
            "$IMAGE" "$TAG" "$DIGEST" > "image-refs/${IMAGE}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-ref-${{ matrix.image }}
          path: image-refs/${{ matrix.image }}.json
          retention-days: 1

  update-manifest:
    name: обновить images.yaml
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-ref-*
          path: image-refs
          merge-multiple: true

      - name: Скрипт применения ссылок
        run: |
          cat > apply_refs.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          for f in image-refs/*.json; do
            image=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['image'])" "$f")
            tag=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['tag'])" "$f")
            digest=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['digest'])" "$f")
            python scripts/update_image_refs.py "$image" "$tag" "$digest"
          done
          EOF

      - name: Проставить tag/digest и запушить в main
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          bash scripts/apply_and_push.sh \
            "chore(images): обновить tag/digest моков (run ${RUN_ID})" \
            bash apply_refs.sh
